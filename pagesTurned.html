<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pages Turned - Turning Pages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

    <div id="site-loader" class="global-loader" role="status" aria-live="polite" aria-hidden="false">
        <div class="book-loader" aria-hidden="true">
            <div class="book-base"></div>
            <div class="book-page page-one"></div>
            <div class="book-page page-two"></div>
            <div class="book-page page-three"></div>
        </div>
        <p id="site-loader-text" class="loader-text">Turning pages...</p>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="discover.html">Discover</a></li>
            <li><a href="reviews.html">Reviews</a></li>
            <li><a href="pagesTurned.html" class="active">Pages Turned</a></li>
            <li><a href="goals.html">Goals</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>My Pages Turned Bookshelf</h2>
            <p id="pages-turned-status" class="search-status" aria-live="polite">Loading your bookshelf...</p>
            <div id="pages-turned-shelf" class="bookshelf-grid" aria-live="polite"></div>
        </section>
    </main>

    <div id="shelf-review-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="shelf-review-title">
        <div class="modal-content">
            <button id="shelf-review-close" class="modal-close" type="button" aria-label="Close review details">Close</button>
            <div id="shelf-review-body"></div>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="pagesTurned.js"></script>

</body>
</html>
